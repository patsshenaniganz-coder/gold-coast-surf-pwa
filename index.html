
<!DOCTYPE html>
<html lang="en-AU">
<head>
<script src="/public/wind-compass.js" defer></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#075479">

<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/public/icon-192.png">
<link rel="apple-touch-icon" href="/public/icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GC Surf">

<title>Gold Coast Surf Forecast</title>

<style>
.wind-legend { background:#fff; border:1px solid #dbe8ef; border-radius:14px; padding:13px 18px; margin:0 0 18px; display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
.wind-legend .key { display:inline-flex; align-items:center; gap:7px; font-size:.88rem; }
.wind-legend .dot { display:inline-block; height:11px; width:11px; border-radius:50%; }
.wind-widget { display:flex; align-items:center; gap:12px; padding:9px 20px 4px; border-bottom:1px solid #e5edf1; }
.wind-values strong { font-size:1.1rem; }
.wind-values p { margin:6px 0; font-size:.9rem; }
:root {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #102b45;
  background: #eef5f9;
}

* { box-sizing: border-box; }
body { margin: 0; }

.hero {
  padding: 50px 24px 70px;
  background: linear-gradient(120deg, #062a48, #087da8);
  color: white;
  text-align: center;
}

.hero h1 {
  font-size: clamp(2rem, 5vw, 3.3rem);
  margin: 0 0 10px;
}

.hero p { color: #d9f3fb; }

.actions {
  margin-top: 24px;
}

button {
  background: #fff;
  color: #075479;
  border: none;
  border-radius: 10px;
  padding: 13px 24px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
}

button:hover { background: #e0f2fe; }
button:disabled { opacity: .6; cursor: wait; }

#status {
  margin-top: 12px;
  font-size: .9rem;
  color: #d9f3fb;
}

.wrap {
  max-width: 1280px;
  margin: -30px auto 60px;
  padding: 0 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
  gap: 18px;
}

.card {
  background: white;
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid #dbe8ef;
  box-shadow: 0 12px 30px #103a551a;
}

.card-head {
  background: linear-gradient(130deg, #075479, #0a97ad);
  padding: 22px;
  color: white;
}

.card-head h2 { margin: 0; }

.score {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin: 18px 18px 0;
  padding: 14px;
  border-radius: 12px;
  background: #f1f5f8;
}

.score strong { font-size: 1.1rem; }
.number { font-size: 1.8rem; font-weight: 800; }

.go { background: #e3f8ec; color: #17623c; }
.marginal { background: #fff2d6; color: #80530b; }
.no-go { background: #ffe5e5; color: #9a2828; }

.body { padding: 12px 20px 22px; }

.metric {
  border-bottom: 1px solid #e5edf1;
  padding: 14px 0;
}

.metric h3 {
  font-size: .78rem;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: #54718a;
  margin: 0 0 6px;
}

.metric p {
  white-space: pre-line;
  line-height: 1.5;
  margin: 0;
  font-size: .94rem;
}

.bottom {
  background: #e9f6fa;
  padding: 14px;
  border-radius: 12px;
  margin-top: 14px;
}

.bottom h3 { color: #006785; }

.empty {
  padding: 36px;
  background: white;
  border-radius: 16px;
  text-align: center;
}

.note {
  margin-top: 20px;
  text-align: center;
  color: #637e8f;
  font-size: .8rem;
}
</style>
</head>

<body>

<header class="hero">
  <h1>🏄 Gold Coast Surf Forecast</h1>
  <p>Current conditions. Clear decisions. Better sessions.</p>

  <div class="actions">
    <button id="refreshBtn" onclick="refreshForecast()">
      ↻ Refresh Forecast
    </button>
    <div id="status" role="status" aria-live="polite">
      Latest published surf reports
    </div>
  </div>
</header>

<main class="wrap">
  <div class="wind-legend" aria-label="Wind direction legend">
  <strong>Wind compass</strong>
  <span class="key"><span class="dot" style="background:#ea741d"></span>Orange — wind comes from</span>
  <span class="key"><span class="dot" style="background:#1688c2"></span>Blue — wind blows towards</span>
</div>
  <div id="forecast-container" class="grid">
    <div class="empty">Loading surf reports...</div>
  </div>

  <p class="note">
    Forecasts are estimates, not live beach observations
    or water-safety advice.
  </p>
</main>

<script>
const fields = [
  ['CONDITIONS', 'Conditions'],
  ['ASSESSMENT', 'Assessment'],
  ['BOARD', 'Board choice'],
  ['BEST WINDOW', 'Best window']
];

function parseReport(raw) {
  const result = {};
  let section = '';

  for (const line of String(raw || '').split(/\r?\n/)) {
    const s = line.trim();

    const header = s.match(
      /^(CONDITIONS|ASSESSMENT|BOARD|BEST WINDOW|BOTTOM LINE)\s*:?(.*)$/i
    );

    if (header) {
      section = header[1].toUpperCase();
      result[section] = header[2].trim();
      continue;
    }

    const kv = s.match(
      /^(DECISION|QUALITY|CONFIDENCE)\s*:\s*(.*)$/i
    );

    if (kv) {
      result[kv[1].toUpperCase()] = kv[2].trim();
      continue;
    }

    if (section && s) {
      result[section] +=
        (result[section] ? '\n' : '') + s;
    }
  }

  return result;
}

function el(tag, cls, value) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (value !== undefined) node.textContent = value;
  return node;
}

function makeCard(item) {
  const d = parseReport(item.result || item.gemini_report);

  const card = el('article', 'card');
  const head = el('div', 'card-head');

  head.append(el('h2', '', item.name || 'Surf spot'));
  card.append(head);

  const decision = (d.DECISION || 'UNRATED').toUpperCase();

  const score = el(
    'div',
    'score ' +
      (decision === 'GO' ? 'go' :
       decision === 'MARGINAL' ? 'marginal' :
       decision === 'NO GO' ? 'no-go' : '')
  );

  score.append(
    el('strong', '', decision),
    el('span', 'number', d.QUALITY || '—')
  );

  card.append(score);

  const windWidget = window.SurfWind?.createWindWidget(item);
if (windWidget) card.append(windWidget);

  const body = el('div', 'body');

  if (d.CONFIDENCE) {
    const block = el('div', 'metric');
    block.append(
      el('h3', '', 'Confidence'),
      el('p', '', d.CONFIDENCE)
    );
    body.append(block);
  }

  for (const [key, label] of fields) {
    if (!d[key]) continue;

    const block = el('section', 'metric');
    block.append(
      el('h3', '', label),
      el('p', '', d[key])
    );
    body.append(block);
  }

  if (d['BOTTOM LINE']) {
    const bottom = el('section', 'bottom');
    bottom.append(
      el('h3', '', 'Bottom line'),
      el('p', '', d['BOTTOM LINE'])
    );
    body.append(bottom);
  }

  if (!d.DECISION && !d.ASSESSMENT) {
    const block = el('div', 'metric');
    block.append(
      el('p', '', item.result || item.gemini_report || '')
    );
    body.append(block);
  }

  card.append(body);
  return card;
}

async function loadSurfData() {
  const container =
    document.getElementById('forecast-container');

  try {
    const response = await fetch('/public/data.json', {
      cache: 'no-store'
    });

    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }

    const data = await response.json();

    const spots = Array.isArray(data)
      ? data
      : data.spots;

    if (!Array.isArray(spots) || !spots.length) {
      throw new Error('No surf spots found');
    }

    container.replaceChildren(...spots.map(makeCard));

  } catch (err) {
    console.error(err);
    container.replaceChildren(
      el('div', 'empty', 'Unable to load: ' + err.message)
    );
  }
}

async function refreshForecast() {
  const button = document.getElementById('refreshBtn');
  const status = document.getElementById('status');

  button.disabled = true;
  status.textContent = 'Requesting a new forecast...';

  try {
    const response = await fetch(
      '/.netlify/functions/refresh-forecast',
      { method: 'POST' }
    );

    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }

    status.textContent =
      'Update requested. Allow time for Make.com and Netlify to finish.';

  } catch (err) {
    status.textContent =
      'Could not request update: ' + err.message;
  } finally {
    button.disabled = false;
  }
}

loadSurfData();
</script>
</body>
</html>
